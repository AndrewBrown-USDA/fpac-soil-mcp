name: fpac-soil-mcp
title: USDA FPAC Soil MCP Server
version: 0.4.0
description: FastMCP server providing USDA NRCS Soil Data Access (SDA) farmland classifications and preliminary FPPA screening metadata.
author: Andrew Brown
license: MIT
tools:
  - name: get_farmland_classification_by_point
    description: Query USDA NRCS Soil Data Access (SDA) by WGS84 point coordinates (latitude, longitude) to retrieve SSURGO soil map unit information, official farmland classification (7 CFR 657), and FPPA regulatory notice.
  - name: get_farmland_classification_by_mukey
    description: Query USDA NRCS Soil Data Access (SDA) by Map Unit Key (mukey) to retrieve SSURGO soil map unit details, official farmland classification (7 CFR 657), and FPPA regulatory notice.
  - name: analyze_farmland_by_polygon
    description: Execute comprehensive FPPA preliminary screening on a GeoJSON Polygon or MultiPolygon AOI. Calculates total equal-area acreage, checks Census 2020 Urban Area statutory exemption status, queries intersecting SSURGO map units via SDA with exact spatial clipping, retrieves crop NCCPI productivity ratings, calculates candidate Land Evaluation (LE) scores, and generates acreage breakdowns by farmland classification.
  - name: analyze_cdl_histogram
    description: Compute preliminary USDA NASS Cropland Data Layer categorical histogram evidence for a Polygon or MultiPolygon AOI. Results describe recent mapped land cover only and do not establish active farming or constitute an official FPPA or LESA determination.
  - name: get_soil_polygons_by_geometry
    description: Retrieve intersecting SSURGO soil map unit polygon geometries and attributes as a GeoJSON FeatureCollection for a Polygon or MultiPolygon AOI, with support for server-side clipping and geodesic acreage.
  - name: check_urban_area_exemption
    description: Screen a project footprint against Census Bureau 2020 Urban Area boundaries (Layer 0) for preliminary statutory exemption analysis under 7 CFR § 658.2(a).
  - name: get_soil_interpretations
    description: Retrieve component-weighted soil interpretations (such as NCCPI v3 crop productivity) from USDA NRCS Soil Data Access (SDA) for a list of map unit keys (mukeys).
  - name: calculate_preliminary_lesa
    description: Calculate preliminary Land Evaluation and Site Assessment (LESA) scores and statutory threshold triggers. Performs spatial SSURGO soil clipping across the AOI geometry, computes area-weighted Land Evaluation (LE, 0-100), evaluates statutory Site Assessment (SA, 0-160) criteria for Form AD-1006 (site) or Form NRCS-CPA-106 (corridor), and enforces the statutory 160-point mandatory alternatives consideration threshold under 7 CFR § 658.4(c)(2).
  - name: analyze_corridor_fppa
    description: Execute multi-county linear corridor FPPA screening, topological erasure of indirect staging areas, Census TIGERweb county partitioning, USDA SDA soil intersection, NASS agricultural baseline queries, composite LE calculation, sum reconciliation, and optional 7 CFR § 658.5(c) Form NRCS-CPA-106 LESA scoring.
  - name: explain_fppa_screening_scope
    description: Provides an authoritative regulatory breakdown distinguishing preliminary SDA soil screening (7 CFR 657) from formal FPPA Land Evaluation & Site Assessment (LESA) scoring and Form AD-1006 determinations (7 CFR 658).
  - name: list_farmland_classes
    description: List documented standard USDA NRCS SSURGO Farmland Classification categories (mapunit.farmlndcl) with definitions, FPPA statuses, and regulatory references.
resources:
  - uri: fppa://regulatory-notice
    name: FPPA Regulatory Notice
    description: Authoritative regulatory disclaimer regarding preliminary screening vs official NRCS determinations.
  - uri: fppa://screening-guidance
    name: FPPA Screening Guidance
    description: Technical guidance on 7 CFR Parts 657/658 and Form AD-1006 / NRCS-CPA-106 workflows.
  - uri: fppa://farmland-classes
    name: Farmland Classes Reference
    description: Reference listing of SSURGO farmland classification categories and statutory criteria.
prompts:
  - name: fppa_screening_assistant
    description: Guides AI assistants through compliant FPPA preliminary screening, tool selection across all 11 tools, and regulatory disclaimers.
    arguments:
      - name: project_name
        description: Optional name or description of the proposed project.
        required: false
      - name: location
        description: Optional geographic location, coordinates, or geometry of the project.
        required: false
      - name: geometry_type
        description: Optional geometry type (e.g. 'point', 'polygon', 'mukey', 'corridor').
        required: false
  - name: fppa_corridor_screening_assistant
    description: Guides AI assistants through linear infrastructure corridor screening, multi-county partitioning, and 7 CFR § 658.5(c) rules for Form NRCS-CPA-106.
    arguments:
      - name: project_name
        description: Optional name or description of the linear infrastructure project.
        required: false
      - name: corridor_length_miles
        description: Optional length of the corridor in miles.
        required: false
  - name: fppa_urban_exemption_assistant
    description: Guides AI assistants through statutory 7 CFR § 658.2(a) urban area exemption evaluations using Census 2020 Urban Areas Layer 0.
    arguments:
      - name: project_name
        description: Optional name or description of the proposed project.
        required: false
      - name: jurisdiction
        description: Optional municipality, county, or state jurisdiction.
        required: false
  - name: fppa_site_assessment_assistant
    description: Guides AI assistants through Part VI Site Assessment (7 CFR § 658.5) criteria, 160/220 scoring thresholds, and Form AD-1006 vs NRCS-CPA-106 selection.
    arguments:
      - name: project_name
        description: Optional name or description of the proposed project.
        required: false
      - name: evaluation_type
        description: Evaluation type ('site' for Form AD-1006 or 'corridor' for Form NRCS-CPA-106).
        required: false
