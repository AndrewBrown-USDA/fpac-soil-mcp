[project]
name = "fpac-soil-mcp"
version = "0.3.1"
description = "FastMCP server for querying USDA NRCS Soil Data Access (SDA) farmland classification and preliminary FPPA screening"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
]

[project.scripts]
fpac-soil-mcp = "fpac_soil_mcp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "eval"]
addopts = "-m 'not live_network and not agent_eval'"
markers = [
    "live_network: marks tests requiring external network access (USDA SDA, Census TIGERweb, etc.) (deselect with -m 'not live_network')",
    "agent_eval: marks agentic integration tests invoking pi coding agent CLI (deselect with -m 'not agent_eval')",
]
