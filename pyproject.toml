[project]
name = "fpac-soil-mcp"
version = "0.2.0"
description = "FastMCP server for querying USDA NRCS Soil Data Access (SDA) farmland classification and preliminary FPPA screening"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
]

[project.scripts]
fpac-soil-mcp = "fpac_soil_mcp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live_sda: mark test as requiring live SDA network connection (opt-in)",
]
