bundle:
  name: agent_openai_agents_sdk

resources:
  apps:
    agent_openai_agents_sdk:
      name: "agent-fpac-soil-openai-sdk"
      description: "OpenAI Agents SDK agent application"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: AGENT_MODEL
            value_from: "llm-endpoint"
          - name: FPAC_MCP_URL
            value: "https://mcp-fpac-soil-7474654188777746.aws.databricksapps.com/mcp"
          - name: FPAC_MCP_TIMEOUT_SECONDS
            value: "180"

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: ""
            permission: 'CAN_MANAGE'

        # NOTE: grants the app's service principal EXECUTE on the Unity Catalog model
        # service so the deployed app can call the model without a manual grant. The
        # agent reads the service name from AGENT_MODEL (value_from: "llm-endpoint"
        # above), so changing the name below changes the model. Same resource as the
        # Apps UI "Model" picker; EXECUTE is the only permission for MODEL_SERVICE.
        - name: 'llm-endpoint'
          uc_securable:
            securable_full_name: 'models.ai.gpt-5-6-luna'
            securable_type: 'MODEL_SERVICE'
            permission: 'EXECUTE'

        # Grants the app's service principal CAN_USE on the fpac-soil-mcp server app.
        - name: 'mcp_server'
          app:
            name: 'mcp-fpac-soil'
            permission: CAN_USE

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_openai_agents_sdk:
          name: agent-fpac-soil-openai-sdk
