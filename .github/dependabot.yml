version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(github-actions)"
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(python-root)"
    groups:
      python-dependencies:
        patterns:
          - "*"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/apps/agent-fpac-soil-openai-sdk"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(python-agent-app)"
    groups:
      python-dependencies:
        patterns:
          - "*"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/eval/fpac_soil_mcp_harness"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(javascript-harness)"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    schedule:
      interval: "weekly"
