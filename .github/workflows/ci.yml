name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run Makefile full pipeline (make all)
        run: make all

      - name: Run live USDA SDA tests (make test-live)
        run: make test-live

  changes:
    name: Detect agent app changes
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            agent:
              - 'apps/agent-fpac-soil-openai-sdk/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  agent-app:
    name: Agent app (apps/agent-fpac-soil-openai-sdk)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agent == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: apps/agent-fpac-soil-openai-sdk/uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Lint the agent app (make app-lint)
        run: make app-lint

      - name: Test the agent app (make app-test)
        run: make app-test
        
  harness:
    name: Test JavaScript harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: eval/fpac_soil_mcp_harness/package-lock.json

      - name: Install harness dependencies
        working-directory: eval/fpac_soil_mcp_harness
        run: npm ci

      - name: Check harness JavaScript syntax
        working-directory: eval/fpac_soil_mcp_harness
        run: npm run check

      - name: Run harness contract and smoke tests
        working-directory: eval/fpac_soil_mcp_harness
        run: npm test
