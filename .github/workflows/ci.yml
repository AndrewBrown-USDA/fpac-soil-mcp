name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run Makefile full pipeline (make all)
        run: make all

      - name: Run live USDA SDA tests (make test-live)
        run: make test-live

  changes:
    name: Detect agent app changes
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect agent app changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "push" && "$BASE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git show --format= --name-only "$HEAD_SHA")"
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi

          if grep -Eq '^(apps/agent-fpac-soil-openai-sdk/|Makefile$|pyproject.toml$|uv.lock$|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
          fi

  agent-app:
    name: Agent app (apps/agent-fpac-soil-openai-sdk)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agent == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: apps/agent-fpac-soil-openai-sdk/uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Lint the agent app (make app-lint)
        run: make app-lint

      - name: Test the agent app (make app-test)
        run: make app-test

      - name: Set up Node.js for the vendored frontend
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/agent-fpac-soil-openai-sdk/frontend/package-lock.json

      - name: Validate the vendored frontend
        run: make app-frontend-check
        
  harness:
    name: Test JavaScript harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: eval/fpac_soil_mcp_harness/package-lock.json

      - name: Install harness dependencies
        working-directory: eval/fpac_soil_mcp_harness
        run: npm ci

      - name: Check harness JavaScript syntax
        working-directory: eval/fpac_soil_mcp_harness
        run: npm run check

      - name: Run harness contract and smoke tests
        working-directory: eval/fpac_soil_mcp_harness
        run: npm test
